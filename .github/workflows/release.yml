# Builds the DSG firmware (EU + Non-EU), the desktop UI for Windows and Linux,
# and publishes them together with the Python API as one GitHub Release.
#
# - Pushing a tag like "v1.2.0" builds everything and publishes a GitHub Release.
# - "Run workflow" (workflow_dispatch) builds everything without publishing a
#   release; the files can be downloaded from the run's Artifacts section.
#
# Release a new version (from an up-to-date main):
#   git tag v1.2.0
#   git push origin v1.2.0

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  SKETCH_DIR: firmware/atek-midas-dsg
  ESP32_CORE: esp32:esp32@2.0.17
  ESP32_INDEX: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
  # Board settings from firmware/atek-midas-dsg/readme.md (ESP32S3 Dev Module)
  FQBN: esp32:esp32:esp32s3:CDCOnBoot=cdc,CPUFreq=240,DebugLevel=none,FlashMode=qio,FlashSize=4M,PartitionScheme=huge_app,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,UploadSpeed=921600

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}   # reported by firmware and UI
      label: ${{ steps.v.outputs.label }}       # used in file names
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - id: v
        run: |
          commit="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            label="v${version}"
          else
            version="dev"
            label="dev-${commit}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}, label: ${label}, commit: ${commit}"

  firmware:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - variant: EU
            wifi: 0
          - variant: NonEU
            wifi: 1
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$ESP32_INDEX"
          arduino-cli lib install "TFT_eSPI@2.5.43" "CST816S@1.3.0" "CST816_TouchLib@2.2"

      - name: Configure TFT_eSPI for LilyGo T-Display S3
        run: |
          f="$HOME/Arduino/libraries/TFT_eSPI/User_Setup_Select.h"
          sed -i \
            -e 's|^#include <User_Setup.h>|//#include <User_Setup.h>|' \
            -e 's|^//#include <User_Setups/Setup206_LilyGo_T_Display_S3.h>|#include <User_Setups/Setup206_LilyGo_T_Display_S3.h>|' \
            "$f"
          grep -q '^#include <User_Setups/Setup206_LilyGo_T_Display_S3.h>' "$f"
          ! grep -q '^#include <User_Setup.h>' "$f"

      - name: Compile (${{ matrix.variant }}, Wi-Fi=${{ matrix.wifi }})
        run: |
          flags="-DDSG_WIFI_ENABLED=${{ matrix.wifi }}"
          flags="$flags -DDSG_FW_VERSION=${{ needs.version.outputs.version }}"
          flags="$flags -DDSG_FW_COMMIT=${{ needs.version.outputs.commit }}"
          arduino-cli compile -b "$FQBN" \
            --build-property "compiler.cpp.extra_flags=$flags" \
            --output-dir build "$SKETCH_DIR"

      - name: Merge bootloader, partitions and app into one .bin (flash at 0x0)
        run: |
          pip install esptool
          out="dsg-firmware-${{ matrix.variant }}-${{ needs.version.outputs.label }}.bin"
          python -m esptool --chip esp32s3 merge-bin -o "$out" \
            --flash-mode keep --flash-freq keep --flash-size keep \
            0x0 build/atek-midas-dsg.ino.bootloader.bin \
            0x8000 build/atek-midas-dsg.ino.partitions.bin \
            0x10000 build/atek-midas-dsg.ino.bin
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: dsg-firmware-*.bin

  ui:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
          # Built on the oldest supported Ubuntu so the binary runs on most distributions.
          - os: ubuntu-22.04
            platform: lin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      APP_NAME: DSG_UI-${{ needs.version.outputs.label }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ui/requirements.txt pyinstaller

      - name: Set UI version
        run: |
          v="${{ needs.version.outputs.version }}"
          [ "$v" = "dev" ] && v="${{ needs.version.outputs.label }}"
          sed -i -E "s/^APP_VERSION = \"[^\"]*\"/APP_VERSION = \"$v\"/" ui/ui/gui.py
          grep -n '^APP_VERSION' ui/ui/gui.py

      - name: Build single-file executable
        working-directory: ui/ui
        run: >
          pyinstaller gui.py --onefile --windowed --noconfirm
          --name "$APP_NAME"
          --collect-all customtkinter
          --collect-all esptool
          --distpath ../../dist

      - name: Smoke test (bundled esptool)
        run: |
          exe="dist/$APP_NAME"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --run-esptool version | tee esptool.txt
          grep -q "esptool" esptool.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.platform }}
          path: dist/DSG_UI-*

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: python-api
          path: |
            ui/ui/dsg_api.py
            ui/ui/api_usage_example.py

  release:
    if: github.ref_type == 'tag'
    needs: [version, firmware, ui, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: DSG ${{ needs.version.outputs.label }}
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Description |
            |---|---|
            | `DSG_UI-${{ needs.version.outputs.label }}-win.exe` | Desktop control UI for **Windows** (no Python required) |
            | `DSG_UI-${{ needs.version.outputs.label }}-lin` | Desktop control UI for **Linux** (no Python required) |
            | `dsg-firmware-EU-${{ needs.version.outputs.label }}.bin` | Firmware for the EU, Wi-Fi **disabled** |
            | `dsg-firmware-NonEU-${{ needs.version.outputs.label }}.bin` | Firmware for non-EU markets, Wi-Fi **enabled** |
            | `dsg_api.py` | Python API to control the DSG from your own scripts (requires `pyserial`) |
            | `api_usage_example.py` | Example script using `dsg_api.py` |
            | `SHA256SUMS.txt` | SHA-256 checksums of the files above |

            The firmware files are merged images (bootloader + partitions + app) and
            are flashed at offset `0x0`, which is what the UI's **FIRMWARE UPDATE** button does.

            **Linux:** make the file executable with `chmod +x DSG_UI-*-lin`. To access the
            DSG's USB serial port, add your user to the `dialout` group once
            (`sudo usermod -aG dialout $USER`) and log out and back in.
          files: dist/*
